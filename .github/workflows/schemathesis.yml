name: Schemathesis (manual)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL server yang diuji (kosong = mock Prism dari spec)'
        required: false
        default: ''
      max_examples:
        description: 'Contoh per operasi'
        required: false
        default: '25'

permissions:
  contents: read

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install schemathesis
      - name: Jalankan Schemathesis
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          MAX_EXAMPLES: ${{ inputs.max_examples }}
        run: |
          if [ -z "$INPUT_BASE_URL" ]; then
            MOCK=1 ./contract/schemathesis.sh
          else
            BASE_URL="$INPUT_BASE_URL" ./contract/schemathesis.sh
          fi
